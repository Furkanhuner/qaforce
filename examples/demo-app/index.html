<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo App — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 4rem auto;
      padding: 1.5rem;
      color: #111;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .25rem; font-weight: 600; font-size: .9rem; }
    input {
      width: 100%; padding: .6rem .75rem;
      font-size: 1rem; border: 1px solid #ccc;
      border-radius: 6px; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    button {
      width: 100%; padding: .75rem;
      background: #2563eb; color: #fff;
      border: none; border-radius: 6px;
      font-size: 1rem; cursor: pointer;
      margin-top: .5rem;
    }
    button:hover { background: #1d4ed8; }
    #error-message { color: #dc2626; margin-top: 1rem; min-height: 1.25rem; }
    #success-message { color: #16a34a; margin-top: 1rem; min-height: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>Login</h1>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          type="email" id="email" name="email"
          autocomplete="email" placeholder="you@example.com"
        >
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          type="password" id="password" name="password"
          autocomplete="current-password" placeholder="••••••••"
        >
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div id="error-message" role="alert" aria-live="polite" aria-atomic="true"></div>
    <div id="success-message" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script>
    var VALID_EMAIL = 'test@example.com';
    var VALID_PASSWORD = 'password123';

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error-message');
      var successEl = document.getElementById('success-message');

      errorEl.textContent = '';
      successEl.textContent = '';

      if (!password) {
        errorEl.textContent = 'Password is required.';
        return;
      }

      if (email === VALID_EMAIL && password === VALID_PASSWORD) {
        successEl.textContent = 'Welcome! You are logged in.';
      } else {
        errorEl.textContent = 'Invalid email or password.';
      }
    });
  </script>
</body>
</html>
